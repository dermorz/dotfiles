[env]
TERM = "alacritty"

[font]
size = 12

[font.bold]
family = "ComicCode Nerd Font"
style = "Bold"

[font.bold_italic]
family = "ComicCode Nerd Font"
style = "Bold Italic"

[font.italic]
family = "ComicCode Nerd Font"
style = "Italic"

[font.normal]
family = "ComicCode Nerd Font"
style = "Regular"

# Fallback fonts for emoji support
[font.offset]
x = 1
y = 3

# Emoji fonts are handled by the system fontconfig
# No additional configuration needed for Alacritty 0.16.1

[hints]
alphabet = "asdfghjkl"

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.binding]
key = "U"
mods = "Control|Shift"

[hints.enabled.mouse]
enabled = true
mods = "None"

[scrolling]
history = 50000

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
